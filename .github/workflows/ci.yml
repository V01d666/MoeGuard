name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    if: github.repository == 'V01d666/MoeGuard'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check client source boundary
        run: |
          python - <<'PY'
          import ast
          import hashlib
          import io
          import json
          import re
          import subprocess
          import tokenize
          from pathlib import Path

          cloud = {
              '__init__.py', 'role_service.py', 'role_service_binding.py',
              'role_service_bootstrap.py', 'role_service_client_events.py',
              'role_service_connection.py', 'role_service_event_contract.py',
              'role_service_http_client.py', 'role_service_mailbox_contract.py',
              'role_service_mailbox_client.py', 'role_service_mailbox_dialog.py',
              'role_service_session.py', 'role_workbench.py',
          }
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          client_roots = {'.github', 'desktop', 'moeguard', 'resources', 'scripts', 'tests'}
          root_files = {'.gitattributes', '.gitignore', 'LICENSE', 'NOTICE', 'README.md', 'README.en.md', 'pyproject.toml'}
          forbidden = {'docs', 'deploy', 'ops-exports', 'artifacts', '.moeguard', '.venv', 'evidence', 'node_modules', 'target', 'dist', 'generated', 'autogenerated'}
          entry_points = {'scripts/windows/start_moeguard.bat', 'scripts/windows/moeguard_patrol.spec'}
          private_reference = re.compile(r'\bD\d{2,}(?:-\d+)?\b|\bPRD\b|作者裁决|作者定稿|author decision', re.I)
          for name in filter(None, paths):
              path = Path(name)
              assert name in root_files or (len(path.parts) > 1 and path.parts[0] in client_roots), name
              assert not path.is_symlink(), name
              assert not set(path.parts) & forbidden, name
              assert path.name not in {'DEVELOPMENT.md', 'AGENTS.md', '.env'}, name
              assert path.suffix.lower() not in {'.enc', '.key', '.pem', '.p12', '.pfx', '.db'}, name
              if name.startswith('moeguard/cloud/'):
                  assert path.parent == Path('moeguard/cloud') and path.name in cloud, name
              if name.startswith('scripts/'):
                  assert name in entry_points, name
              if name.startswith('resources/'):
                  assert name == 'resources/role-service.json' or path.parts[1] in {'icons', 'models', 'roles'}, name
              if name.startswith('desktop/') and path.suffix == '.zip':
                  assert name in {'desktop/assets/whale.zip', 'desktop/test/fixtures/catalog-role.zip', 'desktop/test/fixtures/showcase-role.zip'}, name
              if path.suffix == '.py':
                  text = path.read_text(encoding='utf-8-sig')
                  tree = ast.parse(text)
                  notes = [t.string for t in tokenize.generate_tokens(io.StringIO(text).readline) if t.type == tokenize.COMMENT]
                  notes += [ast.get_docstring(n) or '' for n in ast.walk(tree) if isinstance(n, (ast.Module, ast.ClassDef, ast.FunctionDef, ast.AsyncFunctionDef))]
                  assert not any(private_reference.search(n) for n in notes), name
          catalog = json.loads(Path('desktop/role-catalog-v1.json').read_text(encoding='utf-8'))
          for role, name in [('whale', 'desktop/assets/whale.zip'), ('arona', 'desktop/test/fixtures/catalog-role.zip')]:
              entry = next(item for item in catalog if item['id'] == role)
              data = Path(name).read_bytes()
              assert (len(data), hashlib.sha256(data).hexdigest()) == (entry['bytes'], entry['sha256']), name
          for name in ('LICENSE', 'NOTICE', 'resources/models/YuNet-LICENSE.txt', *entry_points):
              assert Path(name).is_file(), name
          print('Client source boundary: PASS')
          PY

      - name: Install Linux runtime libraries
        run: sudo apt-get update && sudo apt-get install --yes libegl1 libgl1 libglib2.0-0

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: |
          python - <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          tests = sorted(Path('tests').glob('test_*.py'))
          assert tests, 'No test files found'
          scratch = Path('.pytest-tmp/ci')
          scratch.mkdir(parents=True, exist_ok=True)
          failed = []
          for index, path in enumerate(tests):
              print(f'Running {path}', flush=True)
              result = subprocess.run([
                  sys.executable, '-m', 'pytest', str(path), '-q', '-p', 'no:cacheprovider',
                  '--basetemp', str(scratch / f'm{index}'),
              ], timeout=180)
              if result.returncode:
                  failed.append(str(path))
          assert not failed, f'Failed test files: {failed}'
          PY

  desktop-windows:
    if: github.repository == 'V01d666/MoeGuard'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Test the Workshop and Settings
        run: npm test

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri -> target
          cache-bin: 'false'
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the Windows desktop client
        run: npm run build:windows:patrol

      - name: Test the native client
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml --features custom-protocol,patrol-worker,windows-update
