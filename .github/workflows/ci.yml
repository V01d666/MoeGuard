name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    # This workflow is carried by the internal allowlist into the clean public
    # source tree.  Do not run it against the larger private development tree.
    if: github.repository == 'V01d666/MoeGuard'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Linux runtime libraries
        run: sudo apt-get update && sudo apt-get install --yes libegl1 libgl1 libglib2.0-0

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest -q -p no:cacheprovider
